<body>
    <!-- Верхняя панель: колорпикеры + загадка по центру -->
    <div class="top-bar">
        <div class="top-center">
            <div class="quizz-area">
                <button id="previousWord" title="Предыдущее слово"><</button>
                <p id="Quizz"></p>
                <button id="nextWord" title="Следующее слово">></button>
                <div id="elapsedTime" class="time"></div>
            </div>
        </div>
        <div class="slider-group">
            <div class="slider">
                <label for="brushSize" title="Размер кисти">🖌️</label>
                <input type="range" id="brushSize" min="1" max="100" value="3" oninput="updateBrushSizeValue(this.value)">
                <span id="brushSizeValue" style="color: red;">3</span>
                <label for="maxBrushSize" title="Макс">М:</label>
                <input type="range" id="maxBrushSize" min="1" max="1000" value="100" oninput="updateMaxBrushSizeValue(this.value)">
                <span id="maxBrushSizeValue" style="color: red;">300</span>
            </div>
            <div class="slider" style="margin-top:5px;">
                <label title="Оттенок">H</label>
                <input type="range" id="hueSlider" min="0" max="360" value="0">
                <span id="hueValue" style="color:red;min-width:28px;">0</span>
                <label title="Насыщенность">S</label>
                <input type="range" id="satSlider" min="0" max="100" value="0">
                <span id="satValue" style="color:red;min-width:28px;">0</span>
                <label title="Яркость">V</label>
                <input type="range" id="valSlider" min="0" max="100" value="100">
                <span id="valValue" style="color:red;min-width:28px;">100</span>
            </div>
        </div>
    </div>

    <!-- Основная область: канвас слева, кнопки справа -->
    <div class="main-area">
        <div class="color-picker-group" id="colorPickerGroup">
            <input type="color" id="colorPicker" value="#000000" style="display:none;">
            <div class="wheel-wrap">
                <canvas class="color-wheel" id="colorWheel0" width="120" height="120" title="Текущий цвет (C)"></canvas>
                <span class="wheel-label">1</span>
            </div>
            <div class="wheel-wrap">
                <canvas class="color-wheel" id="colorWheel1" width="120" height="120" title="Красный"></canvas>
                <span class="wheel-label">2</span>
            </div>
            <div class="wheel-wrap">
                <canvas class="color-wheel" id="colorWheel2" width="120" height="120" title="Зелёный"></canvas>
                <span class="wheel-label">3</span>
            </div>
            <div class="wheel-wrap">
                <canvas class="color-wheel" id="colorWheel3" width="120" height="120" title="Синий"></canvas>
                <span class="wheel-label">4</span>
            </div>
            <div class="wheel-wrap">
                <canvas class="color-wheel" id="colorWheel4" width="120" height="120" title="Жёлтый"></canvas>
                <span class="wheel-label">5</span>
            </div>
            <div class="wheel-wrap">
                <canvas class="color-wheel" id="colorWheel5" width="120" height="120" title="Пурпурный"></canvas>
                <span class="wheel-label">6</span>
            </div>
            <div class="wheel-wrap">
                <canvas class="color-wheel" id="colorWheel6" width="120" height="120" title="Голубой"></canvas>
                <span class="wheel-label">7</span>
            </div>
        </div>
        <div class="canvas-wrapper">
            <div class="canv-container" id="canvContainer" style="position: relative; width: 100%; height: 100%;">
                <canvas id="backgroundCanvas" style="position: absolute; top: 0; left: 0; z-index: 1;"></canvas>
                <div id="drawingLayer" style="position: absolute; top:0;left:0;width:100%;height:100%;z-index:2;">
                    <canvas id="drawingCanvas" style="position: absolute; top: 0; left: 0; z-index: 2;"></canvas>
                    <canvas id="overlayCanvas" style="position: absolute; top: 0; left: 0; z-index: 1; opacity: 0.5;"></canvas>
                </div>
            </div>
            <div id="cursorPanel" class="cursor-panel" style="display: none;">

        </div>
        <div class="sidebar-right">
            <a href="../index.html" target="_self" title="Выйти" id="exitLink" style="font-size: 30px;">🚪</a>
            <button id="undo" title="Отменить (Z)">⟲</button>
            <button id="redo" title="Повторить (X)">⟳</button>
            <button id="symmetryBtn" title="Симметрия (Q)">🦋</button>
            <button id="eyedropperBtn" title="Пипетка (A)">💧</button>

            <button id="overlayBtn" title="Трафарет (D)">👻</button>
            <button id="loadImageBtn" title="Загрузить (L)">📂</button>
            <button id="bgImageBtn" title="Фон (O)">🌄</button>
            <button id="fillBtn" title="Заливка (F)">🪣</button>
            <button id="zoomBtn" title="Зум (M)">🔍</button>
        </div>
    </div>

    <style>
        .slider {
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .slider input[type="range"] {
            flex-grow: 1;
            background-color: rgba(0, 0, 0, 0.2);
            width: 180px;
            -webkit-appearance: none;

        }

            cursor: pointer;

            box-shadow: -100vw 0 0 100vw rgb(0, 93, 186);

    </style>
    <input type="file" id="imageInput" accept="image/*" style="display:none">
    <input type="file" id="bgImageInput" accept="image/*" style="display:none">

<div id="colorPopup" class="color-popup" style="display:none;">
    <div class="color-popup-content">
        <canvas id="popupWheel" width="500" height="500"></canvas>
        <div class="popup-controls">
            <div class="popup-preview" id="popupPreview"></div>
            <span id="popupHex" style="color:#fff;font-family:monospace;">#000000</span>
            <button id="popupOk">OK</button>
        </div>

</div>

    <script>
const gel = id => document.getElementById(id);

const maxBrushSizeInput = gel('maxBrushSize');

function updateBrushSizeValue(value) {
    gel('brushSizeValue').textContent = value;
}
function updateMaxBrushSizeValue(value) {
    gel('maxBrushSizeValue').textContent = value; 
    brushSizeInput.max = value; 
    if (brushSizeInput.value > value) {
        brushSizeInput.value = value; 
        gel('brushSizeValue').textContent = value; 
    }
}

// Canvas elements
const canvasElements = [
    'backgroundCanvas',
    'drawingCanvas',
    'overlayCanvas'
].map(gel);
const [backgroundCanvas, drawingCanvas, overlayCanvas] = canvasElements;

// Input elements
const colorPicker = gel('colorPicker');
const brushSizeInput = gel('brushSize');
let eraserSize = parseInt(brushSizeInput.value);
const backgroundPicker = gel('backgroundPicker');

// All color pickers for palette
var presetColors = ['#000000', '#ff0000', '#00ff00', '#0000ff', '#ffff00', '#ff00ff', '#00ffff'];

var colorWheels = [];
for (var i = 0; i < 7; i++) {
    var el = gel('colorWheel' + i);
    if (el) colorWheels.push(el);
}

function drawSolidWheel(canvas, color) {
    var ctx = canvas.getContext('2d');
    var w = canvas.width, h = canvas.height;
    var cx = w / 2, cy = h / 2, r = Math.min(cx, cy);
    ctx.clearRect(0, 0, w, h);
    ctx.beginPath();
    ctx.arc(cx, cy, r, 0, Math.PI * 2);
    ctx.fillStyle = color || '#000';
    ctx.fill();
}

function renderColorWheel(canvas) {
    var ctx = canvas.getContext('2d');
    var w = canvas.width, h = canvas.height;
    var cx = w / 2, cy = h / 2, r = Math.min(cx, cy) - 1;
    var isGray = canvas.id === 'colorWheel0';
    var imageData = ctx.createImageData(w, h);
    var d = imageData.data;
    for (var y = 0; y < h; y++) {
        for (var x = 0; x < w; x++) {
            var dx = x - cx + 0.5, dy = y - cy + 0.5;
            var dist = Math.sqrt(dx*dx + dy*dy);
            var idx4 = (y * w + x) * 4;
            if (dist > r) { d[idx4 + 3] = 0; continue; }
            var t = dist / r;
            if (isGray) {
                var gray = Math.round(255 * (1 - t));
                gray = Math.max(0, Math.min(255, gray));
                d[idx4] = gray;
                d[idx4 + 1] = gray;
                d[idx4 + 2] = gray;
                d[idx4 + 3] = 255;
            } else {
                var hue = (Math.atan2(dy, dx) * 180 / Math.PI + 360) % 360;
                var s, v;
                if (t <= 0.5) {
                    s = t * 200;
                    v = 100;
                } else {
                    s = 100;
                    v = (1 - t) * 200;
                }
                var rgb = hsvToRgb(hue, s, v);
                d[idx4] = rgb[0];
                d[idx4 + 1] = rgb[1];
                d[idx4 + 2] = rgb[2];
                d[idx4 + 3] = 255;
            }
        }
    }
    ctx.putImageData(imageData, 0, 0);

    // Draw marker
    var mx = canvas._markerX, my = canvas._markerY;
    if (mx !== undefined && my !== undefined) {
        ctx.beginPath();
        ctx.arc(mx, my, 6, 0, Math.PI * 2);
        ctx.strokeStyle = '#fff';
        ctx.lineWidth = 2.5;
        ctx.stroke();
        ctx.beginPath();
        ctx.arc(mx, my, 7, 0, Math.PI * 2);
        ctx.strokeStyle = 'rgba(0,0,0,0.4)';
        ctx.lineWidth = 1;
        ctx.stroke();
    }
}

// Button elements
const buttonElements = [
    'symmetryBtn',
    'eyedropperBtn',
    'clearBtn',
    'eraserBtn',
    'undo',
    'redo',
    'saveImageBtn',
    'smoothDrawingBtn',
    'overlayBtn'
].map(gel);
const [symmetryButton, eyedropperBtn, clearBtn, eraserBtn, undoBtn, redoBtn, saveImageBtn, smoothDrawingBtn, overlayBtn] = buttonElements;

const ctx = drawingCanvas.getContext('2d');
const bgCtx = backgroundCanvas.getContext('2d');
const overlayCtx = overlayCanvas.getContext('2d');

let isDrawing = false;
let isEyedropperActive = false;
let isErasing = false;
let symmetryBtn = true;
let overlayActive = false;
let isSmoothDrawing = false;

let zoom = 1.5;
let panX = 0;
let panY = 0;
let isPanning = false;
let isBgPanning = false;
let spaceHeld = false;
let panStartX = 0;
let panStartY = 0;
let panStartMX = 0;
let panStartMY = 0;
let bgOffsetX = 0;
let bgOffsetY = 0;
let bgZoom = 1;
let bgPanStartX = 0;
let bgPanStartY = 0;
let bgPanStartMX = 0;
let bgPanStartMY = 0;
let lastX = 0;
let lastY = 0;
let currentCursor = 'url(../cursorsNum/1.png), auto';
let previousCursor = currentCursor;
let _savedCursor = '';
let _lastCursor = null;
let _cursorGen = 0;
let points = [];

let history = [];
let redoHistory = [];

ctx.imageSmoothingEnabled = false;
ctx.willReadFrequently = true;

function saveState() {
    history.push(ctx.getImageData(0, 0, drawingCanvas.width, drawingCanvas.height));
    redoHistory = [];
    updateUndoRedoButtons();
}

function updateUndoRedoButtons() {
    undoBtn.disabled = history.length <= 1;
    redoBtn.disabled = redoHistory.length === 0;
}

var CANVAS_W = 0;
var CANVAS_H = 0;

function allocCanvas(w, h) {
    var bw = Math.ceil(w * devicePixelRatio);
    var bh = Math.ceil(h * devicePixelRatio);
    if (bw <= drawingCanvas.width && bh <= drawingCanvas.height) return;
    var oldW = drawingCanvas.width, oldH = drawingCanvas.height;
    var oldData = oldW > 0 ? ctx.getImageData(0, 0, oldW, oldH) : null;
    bw = Math.max(bw, oldW);
    bh = Math.max(bh, oldH);
    drawingCanvas.width = bw;
    drawingCanvas.height = bh;
    drawingCanvas.style.width = (bw / devicePixelRatio) + 'px';
    drawingCanvas.style.height = (bh / devicePixelRatio) + 'px';
    overlayCanvas.width = bw;
    overlayCanvas.height = bh;
    overlayCanvas.style.width = (bw / devicePixelRatio) + 'px';
    overlayCanvas.style.height = (bh / devicePixelRatio) + 'px';
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.scale(devicePixelRatio, devicePixelRatio);
    if (oldData) ctx.putImageData(oldData, 0, 0);
    CANVAS_W = bw / devicePixelRatio;
    CANVAS_H = bh / devicePixelRatio;
}

function ensureCanvasBounds(x, y, margin) {
    margin = margin || 100;
    if (!CANVAS_W) return;
    var needW = Math.max(CANVAS_W, x + margin);
    var needH = Math.max(CANVAS_H, y + margin);
    if (needW > CANVAS_W || needH > CANVAS_H) {
        allocCanvas(needW, needH);
        redoHistory = [];
    }
}

function resizeCanvases() {
    const container = gel('canvContainer');
    const vw = container.clientWidth;
    const vh = container.clientHeight;
    
    backgroundCanvas.width = vw * devicePixelRatio;
    backgroundCanvas.height = vh * devicePixelRatio;
    backgroundCanvas.style.width = vw + 'px';
    backgroundCanvas.style.height = vh + 'px';
    
    if (!CANVAS_W) {
        allocCanvas(vw, vh);
    }
    
    bgCtx.setTransform(1, 0, 0, 1, 0, 0);
    bgCtx.scale(devicePixelRatio, devicePixelRatio);
    
    if (history.length > 0) {
        ctx.putImageData(history[history.length - 1], 0, 0);
    }
}

function drawSmoothLine(startX, startY, endX, endY) {
    ctx.globalAlpha = 1;
    ctx.strokeStyle = colorPicker.value;
    ctx.lineJoin = 'round';
    ctx.lineCap = 'round';

    ctx.beginPath();
    ctx.moveTo(startX, startY);
    ctx.quadraticCurveTo(startX, startY, endX, endY);
    ctx.stroke();

    points.push({ x: endX, y: endY });

    for (let i = 0; i < points.length; i++) {
        const dx = points[i].x - endX;
        const dy = points[i].y - endY;
        const dd = dx * dx + dy * dy;

        if (dd < 1000) {
            ctx.beginPath();
            ctx.moveTo(endX + (dx * 0.2), endY + (dy * 0.2));
            ctx.lineTo(points[i].x - (dx * 0.2), points[i].y - (dy * 0.2));
            ctx.stroke();
        }
    }
}

function startDrawing(e) {
    if (e.target && e.target.closest && e.target.closest('.color-picker-group')) return;
    closeColorPicker();
    if (isFloodFillActive) return;
    if (e.button === 1) {
        e.preventDefault();
        isBgPanning = true;
        bgPanStartMX = e.clientX;
        bgPanStartMY = e.clientY;
        bgPanStartX = bgOffsetX;
        bgPanStartY = bgOffsetY;
        return;
    }
    if (e.altKey) return;
    if (spaceHeld) {
        isPanning = true;
        _savedCursorPan = document.body.style.cursor || currentCursor;
        document.body.style.cursor = 'grabbing';
        drawingCanvas.style.cursor = 'grabbing';
        panStartMX = e.clientX;
        panStartMY = e.clientY;
        panStartX = panX;
        panStartY = panY;
        return;
    }
    isDrawing = true;
    drawingCanvas.style.cursor = currentCursor;
    [lastX, lastY] = getCoordinates(e);
    ensureCanvasBounds(lastX, lastY);
    if (isSmoothDrawing) {
        points.push({ x: lastX, y: lastY });
    }
}

function applyBgOffset() {
    backgroundCanvas.style.backgroundPosition = 'calc(50% + ' + bgOffsetX + 'px) calc(50% + ' + bgOffsetY + 'px)';
}

function draw(e) {
    if (isBgPanning) {
        var dx = e.clientX - bgPanStartMX;
        var dy = e.clientY - bgPanStartMY;
        if (e.altKey) dx = 0;
        if (e.shiftKey) dy = 0;
        bgOffsetX = bgPanStartX + dx;
        bgOffsetY = bgPanStartY + dy;
        applyBgOffset();
        return;
    }
    if (isPanning) {
        panX = panStartX + (e.clientX - panStartMX);
        panY = panStartY + (e.clientY - panStartMY);
        updateTransform();
        return;
    }
    if (!isDrawing) return;
    drawingCanvas.style.cursor = currentCursor;

    const [x, y] = getCoordinates(e);
    ensureCanvasBounds(x, y);

    ctx.lineWidth = (isErasing ? eraserSize : parseInt(brushSizeInput.value)) * (e.pressure || 1);
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';

    ctx.globalCompositeOperation = isErasing ? 'destination-out' : 'source-over';
    if (!isErasing) {
        ctx.strokeStyle = colorPicker.value;
    }

    if (isSmoothDrawing) {
        drawSmoothLine(lastX, lastY, x, y);
    } else {
        ctx.beginPath(), ctx.moveTo(lastX, lastY), ctx.lineTo(x, y), ctx.stroke();
    }

    if (symmetryBtn) {
        const centerX = drawingCanvas.width / 2;
        const symmetricX = 2 * centerX - x;
        if (isSmoothDrawing) {
            drawSmoothLine(2 * centerX - lastX, lastY, symmetricX, y);
        } else {
            ctx.beginPath();
            ctx.moveTo(2 * centerX - lastX, lastY);
            ctx.lineTo(symmetricX, y);
            ctx.stroke();
        }
    }

    [lastX, lastY] = [x, y];
}

function stopDrawing() {
    if (isBgPanning) {
        isBgPanning = false;
        return;
    }
    if (isPanning) {
        isPanning = false;
        if (spaceHeld) {
            document.body.style.cursor = 'grab';
            drawingCanvas.style.cursor = 'grab';
        } else {
            document.body.style.cursor = _savedCursorPan;
            drawingCanvas.style.cursor = _savedCursorPan;
        }
        return;
    }
    if (isDrawing) {
        isDrawing = false;
        saveState();
        if (isSmoothDrawing) {
            points.length = 0;
        }
    }
}

function getCoordinates(e) {
    var rect = drawingCanvas.getBoundingClientRect();
    return [
        (e.clientX - rect.left) / zoom,
        (e.clientY - rect.top) / zoom
    ];
}

function toggleSymmetry() {
    symmetryBtn = !symmetryBtn;
    symmetryButton.classList.toggle('active', symmetryBtn);
}

function undo() {
    if (history.length > 1) {
        redoHistory.push(history.pop());
        ctx.putImageData(history[history.length - 1], 0, 0);
        updateUndoRedoButtons();
    }
}

function redo() {
    if (redoHistory.length > 0) {
        const state = redoHistory.pop();
        history.push(state);
        ctx.putImageData(state, 0, 0);
        updateUndoRedoButtons();
    }
}

function clearCanvas() {
    ctx.clearRect(0, 0, drawingCanvas.width, drawingCanvas.height);
    saveState();
}

function getContentBounds() {
    var w = drawingCanvas.width, h = drawingCanvas.height;
    var d = ctx.getImageData(0, 0, w, h).data;
    var minX = w, minY = h, maxX = 0, maxY = 0;
    for (var y = 0; y < h; y++) {
        for (var x = 0; x < w; x++) {
            if (d[(y * w + x) * 4 + 3] !== 0) {
                if (x < minX) minX = x;
                if (x > maxX) maxX = x;
                if (y < minY) minY = y;
                if (y > maxY) maxY = y;
            }
        }
    }
    if (minX > maxX) return null;
    return { x: minX, y: minY, w: maxX - minX + 1, h: maxY - minY + 1 };
}

function saveImage() {
    try {
        var bounds = getContentBounds();
        if (!bounds) { alert('Нет рисунка для сохранения.'); return; }
        var tempCanvas = document.createElement('canvas');
        tempCanvas.width = bounds.w;
        tempCanvas.height = bounds.h;
        var tempCtx = tempCanvas.getContext('2d');
        tempCtx.drawImage(drawingCanvas, bounds.x, bounds.y, bounds.w, bounds.h, 0, 0, bounds.w, bounds.h);

        if (overlayActive) {
            tempCtx.globalAlpha = parseFloat(overlayCanvas.style.opacity) || 1;
            tempCtx.drawImage(overlayCanvas, bounds.x, bounds.y, bounds.w, bounds.h, 0, 0, bounds.w, bounds.h);
            tempCtx.globalAlpha = 1.0;
        }

        var link = document.createElement('a');
        link.download = 'my-drawing.png';
        link.href = tempCanvas.toDataURL('image/png');
        link.click();
    } catch (err) {
        console.error('saveImage() failed:', err);
        alert('Не удалось сохранить изображение. Откройте Console в DevTools и посмотрите ошибку.');
    }
}

window.createOverlayLayer = function() {
    closeColorPicker();
    overlayActive = true;
    overlayCtx.clearRect(0, 0, overlayCanvas.width, overlayCanvas.height);
    overlayCtx.drawImage(drawingCanvas, 0, 0);
    overlayCanvas.style.opacity = '0.5';
    clearCanvas();
    overlayBtn.classList.add('active');
};

window.toggleOverlayOpacity = function() {
    if (overlayActive) {
        overlayCanvas.style.opacity = overlayCanvas.style.opacity === '0.5' ? '1' : '0.5';
    }
};

function ringCursorSvg() {
    return '<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32">' +
        '<circle cx="16" cy="16" r="13" fill="none" stroke="black" stroke-width="2"/>' +
        '<circle cx="16" cy="16" r="13" fill="none" stroke="white" stroke-width="1" opacity="0.5"/>' +
        '<line x1="3" y1="16" x2="29" y2="16" stroke="black" stroke-width="1"/>' +
        '<line x1="16" y1="3" x2="16" y2="29" stroke="black" stroke-width="1"/></svg>';
}

function setRingCursor() {
    var s = cursorSize || 32;
    var svg = ringCursorSvg().replace('width="32"', 'width="' + s + '"').replace('height="32"', 'height="' + s + '"');
    var url = 'url("data:image/svg+xml,' + encodeURIComponent(svg) + '") 16 16, auto';
    document.body.style.cursor = url;
    drawingCanvas.style.cursor = url;
    currentCursor = url;
}

function toggleEraser() {
    isErasing = !isErasing;
    eraserBtn.classList.toggle('active', isErasing);
    if (isErasing) {
        _savedCursor = drawingCanvas.style.cursor || currentCursor;
        try { localStorage.setItem('cancerBrushSize', brushSizeInput.value); } catch(e) {}
        brushSizeInput.value = eraserSize;
        gel('brushSizeValue').textContent = eraserSize;
        setRingCursor();
    } else {
        eraserSize = parseInt(brushSizeInput.value);

function hexToRgba(hex) {
    var r = parseInt(hex.slice(1, 3), 16);
    var g = parseInt(hex.slice(3, 5), 16);
    var b = parseInt(hex.slice(5, 7), 16);
    return [r, g, b, 255];
}

function hsvToRgb(h, s, v) {
    s /= 100;
    v /= 100;
    var c = v * s;
    var hp = h / 60;
    var x = c * (1 - Math.abs(hp % 2 - 1));
    var m = v - c;
    var r = 0, g = 0, b = 0;
    if (hp < 1) { r = c; g = x; }
    else if (hp < 2) { r = x; g = c; }
    else if (hp < 3) { g = c; b = x; }
    else if (hp < 4) { g = x; b = c; }
    else if (hp < 5) { r = x; b = c; }
    else { r = c; b = x; }
    return [
        Math.round((r + m) * 255),
        Math.round((g + m) * 255),
        Math.round((b + m) * 255)
    ];
}

function rgbToHex(r, g, b) {
    return '#' + [r, g, b].map(function(v) {
        return v.toString(16).padStart(2, '0');
    }).join('');
}

function hexToHsv(hex) {
    var r = parseInt(hex.slice(1, 3), 16) / 255;
    var g = parseInt(hex.slice(3, 5), 16) / 255;
    var b = parseInt(hex.slice(5, 7), 16) / 255;
    var mx = Math.max(r, g, b), mn = Math.min(r, g, b);
    var d = mx - mn;
    var h = 0, s = mx === 0 ? 0 : d / mx, v = mx;
    if (d !== 0) {
        if (mx === r) h = ((g - b) / d + (g < b ? 6 : 0)) / 6;
        else if (mx === g) h = ((b - r) / d + 2) / 6;
        else h = ((r - g) / d + 4) / 6;
    }
    return [Math.round(h * 360), Math.round(s * 100), Math.round(v * 100)];
}

function updateColorFromSliders() {

    colorPicker.value = hex;

}

function updateWheelMarker(idx) {
    var canvas = colorWheels[idx];
    if (!canvas) return;
    var hex = canvas._lastColor || presetColors[idx] || colorPicker.value;
    if (hex.startsWith('rgb')) {
        var m = hex.match(/(\d+)/g);
        if (!m || m.length < 3) return;
        hex = rgbToHex(parseInt(m[0]), parseInt(m[1]), parseInt(m[2]));
    }
    var hsv = hexToHsv(hex);
    var cx = canvas.width / 2, cy = canvas.height / 2;
    var r = Math.min(cx, cy) - 1;
    if (idx === 0) {
        var t = 1 - hsv[2] / 100;
        canvas._markerX = Math.round(cx + t * r);
        canvas._markerY = cy;
    } else {
        var angle = hsv[0] * Math.PI / 180;
        var t;
        if (hsv[1] >= hsv[2]) {
            t = 1 - hsv[2] / 200;
        } else {
            t = hsv[1] / 200;
        }
        var dist = t * r;
        canvas._markerX = Math.round(cx + dist * Math.cos(angle));
        canvas._markerY = Math.round(cy + dist * Math.sin(angle));
    }
    if (canvas._isHovered) {
        renderColorWheel(canvas);
    } else {
        var solid = canvas._lastColor || presetColors[idx] || '#000';
        drawSolidWheel(canvas, solid);
    }
}

function floodFill(e) {
    try {
        if (!isFloodFillActive) return;
        saveState();

        var rect = drawingCanvas.getBoundingClientRect();
        var w = drawingCanvas.width;
        var h = drawingCanvas.height;

        var startX = Math.floor((e.clientX - rect.left) / rect.width * w);
        var startY = Math.floor((e.clientY - rect.top) / rect.height * h);
        startX = Math.max(0, Math.min(w - 1, startX));
        startY = Math.max(0, Math.min(h - 1, startY));

        var imageData = ctx.getImageData(0, 0, w, h);
        var data = imageData.data;
        var fillColor = hexToRgba(colorPicker.value);
        var tolerance = 30;

        function match(a, b) {
            return Math.abs(a[0] - b[0]) <= tolerance &&
                   Math.abs(a[1] - b[1]) <= tolerance &&
                   Math.abs(a[2] - b[2]) <= tolerance &&
                   Math.abs(a[3] - b[3]) <= tolerance;
        }

        function fillFrom(sx, sy) {
            var si = (sy * w + sx) * 4;
            var target = [data[si], data[si + 1], data[si + 2], data[si + 3]];
            if (match(target, fillColor)) return;

            var filled = new Uint8Array(w * h);
            var visited = new Uint8Array(w * h);
            var stack = [[sx, sy]];

            while (stack.length) {
                var p = stack.pop();
                var x = p[0], y = p[1];
                if (x < 0 || x >= w || y < 0 || y >= h) continue;
                var idx = y * w + x;
                if (visited[idx]) continue;
                visited[idx] = 1;

                var pi = idx * 4;
                var pc = [data[pi], data[pi + 1], data[pi + 2], data[pi + 3]];
                if (match(pc, target)) {
                    data[pi]     = fillColor[0];
                    data[pi + 1] = fillColor[1];
                    data[pi + 2] = fillColor[2];
                    data[pi + 3] = fillColor[3];
                    filled[idx] = 1;

                    stack.push([x - 1, y]);
                    stack.push([x + 1, y]);
                    stack.push([x, y - 1]);
                    stack.push([x, y + 1]);
                }
            }

            for (var n = 0; n < 3; n++) {
                var expand = [];
                for (var dy = 0; dy < h; dy++) {
                    for (var dx = 0; dx < w; dx++) {
                        var didx = dy * w + dx;
                        if (filled[didx]) continue;
                        var dpi = didx * 4;
                        if (data[dpi + 3] > 0) {
                            if ((dx > 0     && filled[didx - 1]) ||
                                (dx < w - 1 && filled[didx + 1]) ||
                                (dy > 0     && filled[didx - w]) ||
                                (dy < h - 1 && filled[didx + w])) {
                                expand.push([dx, dy]);
                            }
                        }
                    }
                }
                for (var ei = 0; ei < expand.length; ei++) {
                    var ex = expand[ei][0], ey = expand[ei][1];
                    var eidx = ey * w + ex;
                    if (filled[eidx]) continue;
                    filled[eidx] = 1;
                    var epi = eidx * 4;
                    data[epi]     = fillColor[0];
                    data[epi + 1] = fillColor[1];
                    data[epi + 2] = fillColor[2];
                    data[epi + 3] = fillColor[3];
                }
            }
        }

        fillFrom(startX, startY);

        if (symmetryBtn) {
            var centerX = w / 2;
            var symX = Math.floor(centerX + (centerX - startX));
            if (symX >= 0 && symX < w) {
                fillFrom(symX, startY);
            }
        }

        ctx.putImageData(imageData, 0, 0);
        isFloodFillActive = false;
        gel('fillBtn').classList.remove('active');
    } catch(err) {
        console.warn('floodFill error:', err);
        isFloodFillActive = false;
        gel('fillBtn').classList.remove('active');
    }
}

function applyCursor(cursorUrl) {
    document.body.style.cursor = cursorUrl;
    drawingCanvas.style.cursor = cursorUrl;
    currentCursor = cursorUrl;
    previousCursor = cursorUrl;
}

function setPngCursor(src) {
    var gen = ++_cursorGen;
    var img = new Image();
    img.onload = function() {
        if (gen !== _cursorGen) return;
        try {
            var c = document.createElement('canvas');
            var s = cursorSize;
            c.width = s;
            c.height = s;
            var ctx2 = c.getContext('2d');
            ctx2.drawImage(img, 0, 0, s, s);
            var dataUrl = c.toDataURL('image/png');
            var hotspot = Math.floor(s / 2);
            applyCursor('url(' + dataUrl + ') ' + hotspot + ' ' + hotspot + ', auto');
        } catch(err) {
            console.warn('setPngCursor error:', err);
        }
    };
    img.onerror = function() {
        console.warn('setPngCursor image load failed:', src);
    };
    img.src = src;
}

function setSvgCursor(svgString, hx, hy) {
    const s = cursorSize;
    const sizedSvg = svgString.replace('width="32"', 'width="' + s + '"').replace('height="32"', 'height="' + s + '"');
    const encoded = encodeURIComponent(sizedSvg);
    // Scale hotspot proportionally to cursor size
    const scaledHx = Math.round(hx / 32 * s);
    const scaledHy = Math.round(hy / 32 * s);
    applyCursor('url("data:image/svg+xml,' + encoded + '") ' + scaledHx + ' ' + scaledHy + ', auto');
}

// Color wheel palette
colorWheels.forEach(function(canvas) {
    function pickFromWheel(e) {
        if (e.altKey) {
            e.preventDefault();
            if (e.type === 'click') return;
            openColorPopup(colorWheels.indexOf(canvas), canvas);
            return;
        }
        var rect = canvas.getBoundingClientRect();
        var scaleX = canvas.width / rect.width;
        var scaleY = canvas.height / rect.height;
        var x = Math.round((e.clientX - rect.left) * scaleX);
        var y = Math.round((e.clientY - rect.top) * scaleY);
        var c = canvas.getContext('2d');
        var pixel = c.getImageData(x, y, 1, 1).data;
        if (pixel[3] < 128) return;
        var hex = '#' + [pixel[0], pixel[1], pixel[2]].map(function(v) {
            return ('0' + v.toString(16)).slice(-2);
        }).join('');
        colorPicker.value = hex;
        ctx.strokeStyle = hex;
        syncSlidersFromColor(hex);
        canvas._markerX = x;
        canvas._markerY = y;
        canvas._lastColor = hex;
        renderColorWheel(canvas);
        updateActiveIndicator(colorWheels.indexOf(canvas));
        saveWheelColors();
    }
    canvas.addEventListener('click', pickFromWheel);
    canvas.addEventListener('pointerdown', pickFromWheel);
});

// Hover: show/hide palette
function onWheelEnter(canvas) {
    canvas._isHovered = true;
    renderColorWheel(canvas);
}
function onWheelLeave(canvas) {
    canvas._isHovered = false;
    var idx = colorWheels.indexOf(canvas);
    var color = canvas._lastColor || presetColors[idx] || '#000';
    drawSolidWheel(canvas, color);
}
colorWheels.forEach(function(canvas) {

function ensurePointerPressure(e){
    // Some browsers provide pressure in pen/touch via e.pressure.
    // Fallback for mouse: treat as fully pressed.
    if (typeof e.pressure !== 'number' || Number.isNaN(e.pressure)) e.pressure = 1;
    return e;
}

function recenterCanvas() {

    panX = (cc.clientWidth - CANVAS_W) * zoom / 2;

function zoomToCenter(v) {

function applyZoomActive(active) {

container.addEventListener('wheel', function(e) {

        backgroundCanvas.style.transformOrigin = '50% 50%';
        backgroundCanvas.style.transform = 'scale(' + bgZoom + ')';
    } else {
        var dir = e.deltaY < 0 ? 1.1 : 0.9;

        applyZoomActive(zoom > 1);
    }
}, { passive: false });

var lastAltY = 0;
document.addEventListener('pointermove', function(e) {

// Popup palette
var _popupTargetIdx = 0;
var _popupColor = '#000000';

function renderPopupWheel(highlightHex) {
    var canvas = gel('popupWheel');
    var ctx = canvas.getContext('2d');
    var w = canvas.width, h = canvas.height;
    var cx = w / 2, cy = h / 2, r = Math.min(cx, cy) - 1;
    var imageData = ctx.createImageData(w, h);
    var d = imageData.data;
    for (var y = 0; y < h; y++) {
        for (var x = 0; x < w; x++) {
            var dx = x - cx + 0.5, dy = y - cy + 0.5;
            var dst = Math.sqrt(dx*dx + dy*dy);
            var i4 = (y * w + x) * 4;
            if (dst > r) { d[i4 + 3] = 0; continue; }
            var hue = (Math.atan2(dy, dx) * 180 / Math.PI + 360) % 360;
            var t = dst / r;
            var s, v;
            if (t <= 0.5) {
                s = t * 200;
                v = 100;
            } else {
                s = 100;
                v = (1 - t) * 200;
            }
            var rgb = hsvToRgb(hue, s, v);
            d[i4] = rgb[0]; d[i4 + 1] = rgb[1]; d[i4 + 2] = rgb[2]; d[i4 + 3] = 255;
        }
    }
    ctx.putImageData(imageData, 0, 0);
    // Marker
    if (highlightHex) {
        var hsv = hexToHsv(highlightHex);
        var angle = hsv[0] * Math.PI / 180;
        var t;
        if (hsv[1] >= hsv[2]) {
            t = 1 - hsv[2] / 200;
        } else {
            t = hsv[1] / 200;
        }
        var dst = t * r;
        var mx = Math.round(cx + dst * Math.cos(angle));
        var my = Math.round(cy + dst * Math.sin(angle));
        ctx.beginPath(); ctx.arc(mx, my, 6, 0, Math.PI * 2);
        ctx.strokeStyle = '#fff'; ctx.lineWidth = 2.5; ctx.stroke();
        ctx.beginPath(); ctx.arc(mx, my, 7, 0, Math.PI * 2);
        ctx.strokeStyle = 'rgba(0,0,0,0.4)'; ctx.lineWidth = 1; ctx.stroke();
    }
}

function openColorPopup(idx, anchor) {
    _popupTargetIdx = idx;
    var canvas = colorWheels[idx];
    _popupColor = canvas._lastColor || presetColors[idx] || '#000000';
    var popup = gel('colorPopup');
    var content = popup.querySelector('.color-popup-content');
    if (anchor) {
        var rect = anchor.getBoundingClientRect();
        var left = rect.right + 10;
        var top = rect.top + rect.height / 2 - 290;
        if (top < 10) top = 10;
        if (top + 640 > window.innerHeight) top = window.innerHeight - 650;
        content.style.left = left + 'px';
        content.style.top = top + 'px';
        popup.classList.add('anchored');
    } else {
        content.style.left = '';
        content.style.top = '';
        popup.classList.remove('anchored');
    }
    popup.style.display = 'flex';
    gel('popupPreview').style.background = _popupColor;
    gel('popupHex').textContent = _popupColor;
    renderPopupWheel(_popupColor);
}

function closeColorPopup(save) {
    var popup = gel('colorPopup');
    popup.style.display = 'none';
    popup.classList.remove('anchored');
    popup.querySelector('.color-popup-content').style.left = '';
    popup.querySelector('.color-popup-content').style.top = '';
    if (save) {
        var canvas = colorWheels[_popupTargetIdx];
        canvas._lastColor = _popupColor;
        colorPicker.value = _popupColor;
        ctx.strokeStyle = _popupColor;
        syncSlidersFromColor(_popupColor);
        updateActiveIndicator(_popupTargetIdx);
        if (_popupTargetIdx === 0) updateWheelMarker(0);
        if (canvas._isHovered) {
            renderColorWheel(canvas);
        } else {
            drawSolidWheel(canvas, _popupColor);
        }
        saveWheelColors();
    }
}

function handlePopupPick(e) {
    var canvas = gel('popupWheel');
    var ctx = canvas.getContext('2d');
    var rect = canvas.getBoundingClientRect();
    var scaleX = canvas.width / rect.width;
    var scaleY = canvas.height / rect.height;
    var px = Math.round((e.clientX - rect.left) * scaleX);
    var py = Math.round((e.clientY - rect.top) * scaleY);
    var pixel = ctx.getImageData(px, py, 1, 1).data;
    if (pixel[3] < 128) return;
    _popupColor = '#' + [pixel[0], pixel[1], pixel[2]].map(function(v) {
        return ('0' + v.toString(16)).slice(-2);
    }).join('');
    gel('popupPreview').style.background = _popupColor;
    gel('popupHex').textContent = _popupColor;
    renderPopupWheel(_popupColor);
}

// === IndexedDB for background persistence ===
function bgDbSave(dataUrl) {
    return new Promise(function(resolve, reject) {
        var req = indexedDB.open('CancerBgDB', 1);
        req.onupgradeneeded = function() {
            req.result.createObjectStore('store');
        };
        req.onsuccess = function() {
            var tx = req.result.transaction('store', 'readwrite');
            tx.objectStore('store').put(dataUrl, 'background');
            tx.oncomplete = function() { resolve(); };
            tx.onerror = function() { reject(tx.error); };
        };
        req.onerror = function() { reject(req.error); };
    });
}

function bgDbLoad() {
    return new Promise(function(resolve) {
        var req = indexedDB.open('CancerBgDB', 1);
        req.onupgradeneeded = function() {
            req.result.createObjectStore('store');
        };
        req.onsuccess = function() {
            var tx = req.result.transaction('store', 'readonly');
            var get = tx.objectStore('store').get('background');
            get.onsuccess = function() { resolve(get.result); };
            get.onerror = function() { resolve(null); };
        };
        req.onerror = function() { resolve(null); };
    });
}

var _bgGen = 0;

bgImageInput.addEventListener('change', function() {
    if (this.files && this.files[0]) {
        var gen = ++_bgGen;
        var reader = new FileReader();
        reader.onload = function(e) {
            if (gen !== _bgGen) return;
            var dataUrl = e.target.result;
            backgroundCanvas.style.backgroundImage = 'url(' + dataUrl + ')';
            bgDbSave(dataUrl).catch(function(err) {
                console.warn('IndexedDB save failed:', err);
                try { localStorage.setItem('cancerBackground', dataUrl); }
                catch(e) { console.warn('localStorage fallback also failed'); }
            });
        };
        reader.readAsDataURL(this.files[0]);
    }
    this.value = '';
});

function setDefaultBg() {
    backgroundCanvas.style.backgroundImage = "url('./images/canvas1.jpg')";
}

bgDbLoad().then(function(dataUrl) {
    if (dataUrl) {
        backgroundCanvas.style.backgroundImage = 'url(' + dataUrl + ')';
    } else {
        setDefaultBg();
    }
}).catch(function() {
    var saved = localStorage.getItem('cancerBackground');
    if (saved) {
        backgroundCanvas.style.backgroundImage = 'url(' + saved + ')';
    } else {
        setDefaultBg();
    }
});

    <script>
    // cancerSettings.js
    (function() {
        const $e = (event, handler, options) => document.addEventListener(event, handler, options);
        const preventDefault = (e) => {
            if (e.target instanceof Element && !['BUTTON', 'INPUT'].includes(e.target.tagName) && !e.target.closest('.slider')) {
                e.preventDefault();
            }
        };
        document.querySelectorAll('*').forEach(element => element.setAttribute('draggable', 'false'));
        const events = ['touchstart', 'mousedown', 'pointerleave', 'mouseleave', 'touchmove', 'keydown'];
        events.forEach(event => $e(event, preventDefault, { passive: false }));
        $e('contextmenu', e => e.preventDefault());
    })();

    // helperFunction.js (таймер + слова)
    const gameStartTime = new Date();
    setInterval(() => {
        const el = gel('elapsedTime');
        if (el) {
            const elapsedSeconds = Math.floor((new Date() - gameStartTime) / 1000);
            el.textContent = `${Math.floor(elapsedSeconds / 60).toString().padStart(2, '0')}:${(elapsedSeconds % 60).toString().padStart(2, '0')}`;
        }
    }, 1000);

    var defaultWords = ['кисть', 'карандаш', 'ластик', 'палитра', 'мазок', 'заливка', 'цвет', 'тень', 'блик', 'рамка', 'фон', 'слой', 'симметрия', 'контур', 'штрих', 'перо', 'планшет', 'экран', 'холст', 'пиксель'];

    async function loadWords() {
        try {
            var r = await fetch('./cancerQuizz.txt');
            var text = await r.text();
            var words = text.split(/[\s,]+/).map(function(w) { return w.trim(); }).filter(Boolean);
            if (words.length > 0) return words;
        } catch(e) {}
        return defaultWords;
    }

    (async () => {
        const wordList = await loadWords();
        let currentWordIndex = Math.floor(Math.random() * wordList.length);
        const updateWord = () => { const q = gel("Quizz"); if (q) q.textContent = wordList[currentWordIndex]; };
        const prevBtn = gel("previousWord");
        const nextBtn = gel("nextWord");
        if (prevBtn) prevBtn.addEventListener("click", () => {
            currentWordIndex = (currentWordIndex - 1 + wordList.length) % wordList.length;
            updateWord();
        });
        if (nextBtn) nextBtn.addEventListener("click", () => {
            currentWordIndex = (currentWordIndex + 1) % wordList.length;
            updateWord();
        });
        updateWord();
    })();

    // cancerHotkey.js
    document.addEventListener('keydown', function(event) {
        if (event.code >= 'Digit1' && event.code <= 'Digit7') {
            var idx = parseInt(event.code.slice(5)) - 1;
            var canvas = colorWheels[idx];
            if (canvas && canvas._lastColor) {
                event.preventDefault();
                colorPicker.value = canvas._lastColor;
                ctx.strokeStyle = canvas._lastColor;
                syncSlidersFromColor(canvas._lastColor);
                updateActiveIndicator(idx);
            }
            return;
        }

        var action = {
            'KeyA': 'eyedropperBtn',
            'KeyZ': 'undo',
            'KeyX': 'redo',
            'KeyB': 'backgroundPicker',
            'KeyE': 'eraserBtn',
            'KeyS': 'saveImageBtn',
            'KeyC': clearCanvas,
            'KeyR': 'clear',
            'KeyQ': 'symmetryBtn',
            'KeyV': 'smoothDrawingBtn',
            'KeyD': window.createOverlayLayer,
            'KeyG': window.toggleOverlayOpacity,
            'KeyF': 'fillBtn',
            'KeyL': 'loadImageBtn',
            'KeyH': 'changeCursorBtn',
            'KeyO': 'bgImageBtn',
            'KeyM': 'zoomBtn',
        }[event.code];

        if (action) {
            event.preventDefault();
            closeColorPicker();
            typeof action === 'string' ? gel(action)?.click() : action();
        }
    });
