<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DrawCaterpillar</title>
    <link rel="stylesheet" href="cancer.css">
    <!-- <script src="../cursors.js" async></script> -->
    <style>
        #drawingCanvas {
            cursor: url('../cursorsNum/4.png'), auto;
        }
    </style>
</head>

<body>
    <!-- Верхняя панель: колорпикеры + загадка по центру -->
    <div class="top-bar">
        <div class="top-center">
            <div class="color-picker-group" id="colorPickerGroup">
                <input type="color" id="colorPicker" value="#000000" title="Текущий цвет (C)">
                <input type="color" id="colorPicker2" value="#ff0000" title="Красный">
                <input type="color" id="colorPicker3" value="#00ff00" title="Зелёный">
                <input type="color" id="colorPicker4" value="#0000ff" title="Синий">
                <input type="color" id="colorPicker5" value="#ffff00" title="Жёлтый">
                <input type="color" id="colorPicker6" value="#ff00ff" title="Пурпурный">
                <input type="color" id="colorPicker7" value="#00ffff" title="Голубой">
            </div>
            <div class="quizz-area">
                <button id="previousWord" title="Предыдущее слово"><</button>
                <p id="Quizz"></p>
                <button id="nextWord" title="Следующее слово">></button>
                <div id="elapsedTime" class="time"></div>
            </div>
        </div>
        <div class="slider-group">
            <div class="slider">
                <label for="brushSize" title="Размер кисти">🖌️</label>
                <input type="range" id="brushSize" min="1" max="100" value="3" oninput="updateBrushSizeValue(this.value)">
                <span id="brushSizeValue" style="color: red;">3</span>
                <label for="maxBrushSize" title="Макс">М:</label>
                <input type="range" id="maxBrushSize" min="1" max="1000" value="100" oninput="updateMaxBrushSizeValue(this.value)">
                <span id="maxBrushSizeValue" style="color: red;">300</span>
            </div>
        </div>
    </div>

    <!-- Основная область: канвас слева, кнопки справа -->
    <div class="main-area">
        <div class="canvas-wrapper">
            <div class="canv-container" id="canvContainer" style="position: relative; width: 100%; height: 100%;">
                <canvas id="backgroundCanvas" style="position: absolute; top: 0; left: 0; z-index: 1;"></canvas>
                <canvas id="drawingCanvas" style="position: absolute; top: 0; left: 0; z-index: 3;"></canvas>
                <canvas id="overlayCanvas" style="position: absolute; top: 0; left: 0; z-index: 2; opacity: 0.5;"></canvas>
            </div>
            <div id="cursorPanel" class="cursor-panel" style="display: none;">
                <div id="cursorList"></div>
            </div>
        </div>
        <div class="sidebar-right">
            <a href="../index.html" target="_self" title="Выйти" id="exitLink" style="font-size: 30px;">🚪</a>
            <button id="undo" title="Отменить (Z)">⟲</button>
            <button id="redo" title="Повторить (X)">⟳</button>
            <button id="symmetryBtn" title="Симметрия (S)">🦋</button>
            <button id="eyedropperBtn" title="Пипетка (A)">💧</button>
            <button id="changeCursorBtn" title="Курсор">🎨</button>
            <button id="clearBtn" title="Очистить">💀</button>
            <button id="saveImageBtn" title="Сохранить">💾</button>
            <button id="eraserBtn" title="Стерка">🧽</button>
            <button id="smoothDrawingBtn" title="Паутинка">🌀</button>
            <button id="overlayBtn" title="Трафарет (D)">👻</button>
        </div>
    </div>

    <style>
        .slider {
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .slider input[type="range"] {
            flex-grow: 1;
            background-color: rgba(0, 0, 0, 0.2);
            width: 180px;
            -webkit-appearance: none;
            appearance: none;
            outline: none;
            overflow: hidden;
            touch-action: pan-y;
            border-radius: 20px;
            height: 6px;
        }
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 12px;
            height: 20px;
            background: #00ff08;
            cursor: pointer;
            border-radius: 10px;
            box-shadow: -100vw 0 0 100vw rgb(0, 93, 186);
        }
        input[type="range"]::-moz-range-thumb {
            height: 20px;
            background: #4CAF50;
            color: #00ff08;
            cursor: progress;
            border-radius: 10px;
            box-shadow: -100vw 0 0 100vw dodgerblue;
        }
    </style>
    <script>
const gel = id => document.getElementById(id);

const maxBrushSizeInput = gel('maxBrushSize');

function updateBrushSizeValue(value) {
    gel('brushSizeValue').textContent = value;
}
function updateMaxBrushSizeValue(value) {
    gel('maxBrushSizeValue').textContent = value; 
    brushSizeInput.max = value; 
    if (brushSizeInput.value > value) {
        brushSizeInput.value = value; 
        gel('brushSizeValue').textContent = value; 
    }
}

// Canvas elements
const canvasElements = [
    'backgroundCanvas',
    'drawingCanvas',
    'overlayCanvas'
].map(gel);
const [backgroundCanvas, drawingCanvas, overlayCanvas] = canvasElements;

// Input elements
const colorPicker = gel('colorPicker');
const brushSizeInput = gel('brushSize');
const backgroundPicker = gel('backgroundPicker');

// All color pickers for palette
const colorPickers = [
    'colorPicker',
    'colorPicker2',
    'colorPicker3',
    'colorPicker4',
    'colorPicker5',
    'colorPicker6',
    'colorPicker7'
].map(gel).filter(Boolean);

// Button elements
const buttonElements = [
    'symmetryBtn',
    'eyedropperBtn',
    'clearBtn',
    'eraserBtn',
    'undo',
    'redo',
    'saveImageBtn',
    'smoothDrawingBtn',
    'overlayBtn'
].map(gel);
const [symmetryButton, eyedropperBtn, clearBtn, eraserBtn, undoBtn, redoBtn, saveImageBtn, smoothDrawingBtn, overlayBtn] = buttonElements;

const ctx = drawingCanvas.getContext('2d');
const bgCtx = backgroundCanvas.getContext('2d');
const overlayCtx = overlayCanvas.getContext('2d');

let isDrawing = false;
let isEyedropperActive = false;
let isErasing = false;
let symmetryBtn = true;
let overlayActive = false;
let isSmoothDrawing = false;

let lastX = 0;
let lastY = 0;
let currentCursor = 'url(../cursorsNum/1.png), auto';
let previousCursor = currentCursor;
let points = [];

let history = [];
let redoHistory = [];

ctx.imageSmoothingEnabled = false;
ctx.willReadFrequently = true;

function saveState() {
    history.push(ctx.getImageData(0, 0, drawingCanvas.width, drawingCanvas.height));
    redoHistory = [];
    updateUndoRedoButtons();
}

function updateUndoRedoButtons() {
    undoBtn.disabled = history.length <= 1;
    redoBtn.disabled = redoHistory.length === 0;
}

function resizeCanvases() {
    const container = gel('canvContainer');
    const w = container.clientWidth;
    const h = container.clientHeight;
    
    backgroundCanvas.width = w * devicePixelRatio;
    backgroundCanvas.height = h * devicePixelRatio;
    drawingCanvas.width = w * devicePixelRatio;
    drawingCanvas.height = h * devicePixelRatio;
    overlayCanvas.width = w * devicePixelRatio;
    overlayCanvas.height = h * devicePixelRatio;
    
    backgroundCanvas.style.width = w + 'px';
    backgroundCanvas.style.height = h + 'px';
    drawingCanvas.style.width = w + 'px';
    drawingCanvas.style.height = h + 'px';
    overlayCanvas.style.width = w + 'px';
    overlayCanvas.style.height = h + 'px';
    
    // Prevent scale accumulation on repeated resizes
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    bgCtx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.scale(devicePixelRatio, devicePixelRatio);
    bgCtx.scale(devicePixelRatio, devicePixelRatio);
    
    if (history.length > 0) {
        ctx.putImageData(history[history.length - 1], 0, 0);
    }
}

function drawSmoothLine(startX, startY, endX, endY) {
    ctx.globalAlpha = 1;
    ctx.strokeStyle = colorPicker.value;
    ctx.lineJoin = 'round';
    ctx.lineCap = 'round';

    ctx.beginPath();
    ctx.moveTo(startX, startY);
    ctx.quadraticCurveTo(startX, startY, endX, endY);
    ctx.stroke();

    points.push({ x: endX, y: endY });

    for (let i = 0; i < points.length; i++) {
        const dx = points[i].x - endX;
        const dy = points[i].y - endY;
        const dd = dx * dx + dy * dy;

        if (dd < 1000) {
            ctx.beginPath();
            ctx.moveTo(endX + (dx * 0.2), endY + (dy * 0.2));
            ctx.lineTo(points[i].x - (dx * 0.2), points[i].y - (dy * 0.2));
            ctx.stroke();
        }
    }
}

function startDrawing(e) {
    isDrawing = true;
    [lastX, lastY] = getCoordinates(e);
    if (isSmoothDrawing) {
        points.push({ x: lastX, y: lastY });
    }
}

function draw(e) {
    if (!isDrawing) return;

    const [x, y] = getCoordinates(e);

    ctx.lineWidth = brushSizeInput.value * (e.pressure || 1);
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';

    ctx.globalCompositeOperation = isErasing ? 'destination-out' : 'source-over';
    if (!isErasing) {
        ctx.strokeStyle = colorPicker.value;
    }

    if (isSmoothDrawing) {
        drawSmoothLine(lastX, lastY, x, y);
    } else {
        ctx.beginPath(), ctx.moveTo(lastX, lastY), ctx.lineTo(x, y), ctx.stroke();
    }

    if (symmetryBtn) {
        const centerX = drawingCanvas.width / 2;
        const symmetricX = 2 * centerX - x;
        if (isSmoothDrawing) {
            drawSmoothLine(2 * centerX - lastX, lastY, symmetricX, y);
        } else {
            ctx.beginPath();
            ctx.moveTo(2 * centerX - lastX, lastY);
            ctx.lineTo(symmetricX, y);
            ctx.stroke();
        }
    }

    [lastX, lastY] = [x, y];
}

function stopDrawing() {
    if (isDrawing) {
        isDrawing = false;
        saveState();
        if (isSmoothDrawing) {
            points.length = 0;
        }
    }
}

function getCoordinates(e) {
    const rect = drawingCanvas.getBoundingClientRect();
    return [
        e.clientX - rect.left,
        e.clientY - rect.top
    ];
}

function toggleSymmetry() {
    symmetryBtn = !symmetryBtn;
    symmetryButton.classList.toggle('active', symmetryBtn);
}

function undo() {
    if (history.length > 1) {
        redoHistory.push(history.pop());
        ctx.putImageData(history[history.length - 1], 0, 0);
        updateUndoRedoButtons();
    }
}

function redo() {
    if (redoHistory.length > 0) {
        const state = redoHistory.pop();
        history.push(state);
        ctx.putImageData(state, 0, 0);
        updateUndoRedoButtons();
    }
}

function clearCanvas() {
    ctx.clearRect(0, 0, drawingCanvas.width, drawingCanvas.height);
    saveState();
}

function saveImage() {
    try {
        const tempCanvas = document.createElement('canvas');
        tempCanvas.width = drawingCanvas.width;
        tempCanvas.height = drawingCanvas.height;
        const tempCtx = tempCanvas.getContext('2d');

        tempCtx.drawImage(drawingCanvas, 0, 0);

        if (overlayActive) {
            tempCtx.globalAlpha = parseFloat(overlayCanvas.style.opacity) || 1;
            tempCtx.drawImage(overlayCanvas, 0, 0);
            tempCtx.globalAlpha = 1.0;
        }

        const link = document.createElement('a');
        link.download = 'my-drawing.png';
        link.href = tempCanvas.toDataURL('image/png');
        link.click();
    } catch (err) {
        console.error('saveImage() failed:', err);
        alert('Не удалось сохранить изображение. Откройте Console в DevTools и посмотрите ошибку.');
    }
}

window.createOverlayLayer = function() {
    overlayActive = true;
    overlayCtx.clearRect(0, 0, overlayCanvas.width, overlayCanvas.height);
    overlayCtx.drawImage(drawingCanvas, 0, 0);
    overlayCanvas.style.opacity = '0.5';
    clearCanvas();
    overlayBtn.classList.add('active');
};

window.toggleOverlayOpacity = function() {
    if (overlayActive) {
        overlayCanvas.style.opacity = overlayCanvas.style.opacity === '0.5' ? '1' : '0.5';
    }
};

function toggleEraser() {
    isErasing = !isErasing;
    eraserBtn.classList.toggle('active', isErasing);
    drawingCanvas.style.cursor = isErasing ? 'url(../cursorsNum/2.png), auto' : previousCursor;
}

function toggleEyedropper() {
    isEyedropperActive = !isEyedropperActive;
    eyedropperBtn.classList.toggle('active', isEyedropperActive);
    if (isEyedropperActive) {
        previousCursor = drawingCanvas.style.cursor;
        drawingCanvas.style.cursor = 'url(../cursorsNum/3.png), auto';
        drawingCanvas.addEventListener('click', pickColor, { once: true });
    } else {
        drawingCanvas.style.cursor = previousCursor;
        drawingCanvas.removeEventListener('click', pickColor);
    }
}

function pickColor(e) {
    const rect = drawingCanvas.getBoundingClientRect();
    const x = e.clientX - rect.left;
    const y = e.clientY - rect.top;
    const pixel = ctx.getImageData(x, y, 1, 1).data;
    const color = `rgb(${pixel[0]}, ${pixel[1]}, ${pixel[2]})`;
    colorPicker.value = color;
    ctx.strokeStyle = color;

    isEyedropperActive = false;
    eyedropperBtn.classList.remove('active');
    drawingCanvas.style.cursor = previousCursor;
}

function initializeCursor() {
    drawingCanvas.style.cursor = currentCursor;
}

function toggleSmoothDrawing() {
    isSmoothDrawing = !isSmoothDrawing;
    smoothDrawingBtn.classList.toggle('active', isSmoothDrawing);
}

// Cursor panel
const cursorPanel = gel('cursorPanel');
const cursorList = gel('cursorList');
const changeCursorBtn = gel('changeCursorBtn');
let cursorSize = 32;

// PNG cursors from ../cursorsNum/
const cursorFiles = [
    '1.png','2.png','3.png','4.png','5.png','6.png','7.png','9.png','10.png',
    '12.png','13.png','14.png','15.png','16.png','17.png','18.png','19.png','20.png',
    '22.png','23.png','30.png','31.png','32.png','33.png','34.png','35.png','36.png',
    '37.png','38.png','39.png','40.png','41.png','42.png','43.png','44.png','45.png',
    '46.png','47.png','48.png','49.png','50.png','51.png','52.png','53.png'
];

// SVG cursors with individual hotspots (hx, hy in 32x32 space)
const svgCursors = [
    { name: 'Карандаш', hx: 28, hy: 4, svg: '<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32"><circle cx="16" cy="16" r="2" fill="black"/><line x1="16" y1="16" x2="28" y2="4" stroke="black" stroke-width="1.5"/></svg>' },
    { name: 'Кисть', hx: 16, hy: 16, svg: '<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32"><circle cx="16" cy="16" r="4" fill="black" opacity="0.5"/><circle cx="16" cy="16" r="2" fill="black"/></svg>' },
    { name: 'Кисть 2', hx: 16, hy: 16, svg: '<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32"><circle cx="16" cy="16" r="6" fill="black" opacity="0.3"/><circle cx="16" cy="16" r="3" fill="black" opacity="0.6"/><circle cx="16" cy="16" r="1" fill="black"/></svg>' },
    { name: 'Маркер', hx: 16, hy: 16, svg: '<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32"><rect x="8" y="8" width="16" height="16" rx="3" fill="black" opacity="0.4"/><rect x="12" y="12" width="8" height="8" rx="2" fill="black"/></svg>' },
    { name: 'Ластик', hx: 16, hy: 16, svg: '<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32"><rect x="6" y="6" width="20" height="20" rx="4" fill="white" stroke="black" stroke-width="1.5"/></svg>' },
    { name: 'Крест', hx: 16, hy: 16, svg: '<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32"><line x1="16" y1="0" x2="16" y2="32" stroke="black" stroke-width="1"/><line x1="0" y1="16" x2="32" y2="16" stroke="black" stroke-width="1"/><circle cx="16" cy="16" r="1" fill="red"/></svg>' },
    { name: 'Точка', hx: 16, hy: 16, svg: '<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32"><circle cx="16" cy="16" r="3" fill="black"/></svg>' },
    { name: 'Цель', hx: 16, hy: 16, svg: '<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32"><circle cx="16" cy="16" r="8" fill="none" stroke="black" stroke-width="1"/><circle cx="16" cy="16" r="2" fill="black"/><line x1="16" y1="4" x2="16" y2="10" stroke="black" stroke-width="1"/><line x1="16" y1="22" x2="16" y2="28" stroke="black" stroke-width="1"/><line x1="4" y1="16" x2="10" y2="16" stroke="black" stroke-width="1"/><line x1="22" y1="16" x2="28" y2="16" stroke="black" stroke-width="1"/></svg>' },
    { name: 'Стрелка', hx: 2, hy: 2, svg: '<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32"><polygon points="2,2 2,30 10,22 16,30 18,28 12,20 22,20" fill="black"/></svg>' },
];

function applyCursor(cursorUrl) {
    document.body.style.cursor = cursorUrl;
    drawingCanvas.style.cursor = cursorUrl;
    currentCursor = cursorUrl;
    previousCursor = cursorUrl;
}

function setPngCursor(src) {
    const img = new Image();
    img.onload = function() {
        const c = document.createElement('canvas');
        const s = cursorSize;
        c.width = s;
        c.height = s;
        const ctx2 = c.getContext('2d');
        ctx2.drawImage(img, 0, 0, s, s);
        const dataUrl = c.toDataURL('image/png');
        const hotspot = Math.floor(s / 2);
        applyCursor('url(' + dataUrl + ') ' + hotspot + ' ' + hotspot + ', auto');
    };
    img.src = src;
}

function setSvgCursor(svgString, hx, hy) {
    const s = cursorSize;
    const sizedSvg = svgString.replace('width="32"', 'width="' + s + '"').replace('height="32"', 'height="' + s + '"');
    const encoded = encodeURIComponent(sizedSvg);
    // Scale hotspot proportionally to cursor size
    const scaledHx = Math.round(hx / 32 * s);
    const scaledHy = Math.round(hy / 32 * s);
    applyCursor('url("data:image/svg+xml,' + encoded + '") ' + scaledHx + ' ' + scaledHy + ', auto');
}

function buildPngTab() {
    cursorList.innerHTML = '';
    cursorFiles.forEach(file => {
        const item = document.createElement('div');
        item.className = 'cursor-item';
        const img = document.createElement('img');
        img.src = '../cursorsNum/' + file;
        img.className = 'cursor-preview';
        img.draggable = false;
        img.loading = 'eager';
        item.appendChild(img);
        item.addEventListener('click', () => {
            setPngCursor('../cursorsNum/' + file);
            cursorPanel.style.display = 'none';
        });
        cursorList.appendChild(item);
    });
}

function buildSvgTab() {
    cursorList.innerHTML = '';
    svgCursors.forEach(c => {
        const item = document.createElement('div');
        item.className = 'cursor-item';
        item.title = c.name;
        const preview = document.createElement('img');
        preview.src = 'data:image/svg+xml,' + encodeURIComponent(c.svg);
        preview.className = 'cursor-preview';
        preview.draggable = false;
        preview.style.background = 'rgba(255,255,255,0.2)';
        preview.style.borderRadius = '4px';
        item.appendChild(preview);
        item.addEventListener('click', () => {
            setSvgCursor(c.svg);
            cursorPanel.style.display = 'none';
        });
        cursorList.appendChild(item);
    });
}

function toggleCursorPanel() {
    if (cursorPanel.style.display === 'none' || !cursorPanel.style.display) {
        // Build panel with tabs
        cursorList.innerHTML = '';
        
        // Tabs
        const tabsDiv = document.createElement('div');
        tabsDiv.style.cssText = 'display:flex;gap:4px;margin-bottom:8px;';
        const pngTab = document.createElement('button');
        pngTab.textContent = 'Мои';
        pngTab.style.cssText = 'flex:1;padding:4px;background:rgba(255,255,255,0.2);color:white;border:none;border-radius:6px;cursor:pointer;font-size:14px;';
        const svgTab = document.createElement('button');
        svgTab.textContent = 'SVG';
        svgTab.style.cssText = 'flex:1;padding:4px;background:rgba(255,255,255,0.1);color:white;border:none;border-radius:6px;cursor:pointer;font-size:14px;';
        tabsDiv.appendChild(pngTab);
        tabsDiv.appendChild(svgTab);
        cursorList.appendChild(tabsDiv);
        
        // Size slider
        const sizeDiv = document.createElement('div');
        sizeDiv.style.cssText = 'display:flex;align-items:center;gap:6px;margin-bottom:8px;color:white;font-size:13px;';
        sizeDiv.innerHTML = 'Размер: <input type="range" id="cursorSizeSlider" min="16" max="128" value="' + cursorSize + '" style="width:100px;height:4px;box-shadow:none;"> <span id="cursorSizeLabel">' + cursorSize + '</span>';
        cursorList.appendChild(sizeDiv);
        
        // Grid container
        const grid = document.createElement('div');
        grid.id = 'cursorGrid';
        cursorList.appendChild(grid);
        
        // Tab switching
        let activeTab = 'png';
        function switchTab(tab) {
            activeTab = tab;
            pngTab.style.background = tab === 'png' ? 'rgba(255,255,255,0.2)' : 'rgba(255,255,255,0.1)';
            svgTab.style.background = tab === 'svg' ? 'rgba(255,255,255,0.2)' : 'rgba(255,255,255,0.1)';
            grid.innerHTML = '';
            if (tab === 'png') {
                cursorFiles.forEach(file => {
                    const item = document.createElement('div');
                    item.className = 'cursor-item';
                    const img = document.createElement('img');
                    img.src = '../cursorsNum/' + file;
                    img.className = 'cursor-preview';
                    img.draggable = false;
                    img.loading = 'eager';
                    item.appendChild(img);
                    item.addEventListener('click', () => {
                        setPngCursor('../cursorsNum/' + file);
                        cursorPanel.style.display = 'none';
                    });
                    grid.appendChild(item);
                });
            } else {
                svgCursors.forEach(c => {
                    const item = document.createElement('div');
                    item.className = 'cursor-item';
                    item.title = c.name + ' (hotspot: ' + c.hx + ',' + c.hy + ')';
                    const preview = document.createElement('img');
                    preview.src = 'data:image/svg+xml,' + encodeURIComponent(c.svg);
                    preview.className = 'cursor-preview';
                    preview.draggable = false;
                    preview.style.background = 'rgba(255,255,255,0.2)';
                    preview.style.borderRadius = '4px';
                    item.appendChild(preview);
                    item.addEventListener('click', () => {
                        setSvgCursor(c.svg, c.hx, c.hy);
                        cursorPanel.style.display = 'none';
                    });
                    grid.appendChild(item);
                });
            }
        }
        
        pngTab.addEventListener('click', () => switchTab('png'));
        svgTab.addEventListener('click', () => switchTab('svg'));
        
        // Size slider handler
        setTimeout(() => {
            const slider = gel('cursorSizeSlider');
            const label = gel('cursorSizeLabel');
            if (slider) {
                slider.addEventListener('input', () => {
                    cursorSize = parseInt(slider.value);
                    label.textContent = cursorSize;
                });
            }
        }, 0);
        
        switchTab('png');
        cursorPanel.style.display = 'block';
    } else {
        cursorPanel.style.display = 'none';
    }
}

changeCursorBtn.addEventListener('click', toggleCursorPanel);

// Color picker palette

    <!-- Встроенные скрипты (CORS fix for file://) -->
    <script>
    // cancerSettings.js
    (function() {
        const $e = (event, handler, options) => document.addEventListener(event, handler, options);
        const preventDefault = (e) => {
            if (e.target instanceof Element && !['BUTTON', 'INPUT'].includes(e.target.tagName) && !e.target.closest('.slider')) {
                e.preventDefault();
            }
        };
        document.querySelectorAll('*').forEach(element => element.setAttribute('draggable', 'false'));
        const events = ['touchstart', 'mousedown', 'pointerleave', 'mouseleave', 'touchmove', 'keydown'];
        events.forEach(event => $e(event, preventDefault, { passive: false }));
        $e('contextmenu', e => e.preventDefault());
    })();

    // helperFunction.js (таймер + слова)
    const gameStartTime = new Date();
    setInterval(() => {
        const el = gel('elapsedTime');
        if (el) {
            const elapsedSeconds = Math.floor((new Date() - gameStartTime) / 1000);
            el.textContent = `${Math.floor(elapsedSeconds / 60).toString().padStart(2, '0')}:${(elapsedSeconds % 60).toString().padStart(2, '0')}`;
        }
    }, 1000);

    const fetchWords = async () => {
        try {
            const response = await fetch('../Quizz.txt');
            return (await response.text()).split(/[\s,]+/).map(word => word.trim());
        } catch (error) {
            console.error('Error loading words:', error);
            return [];
        }
    };

    (async () => {
        const wordList = await fetchWords();
        if (wordList.length > 0) {
            let currentWordIndex = Math.floor(Math.random() * wordList.length);
            const updateWord = () => { const q = gel("Quizz"); if (q) q.textContent = wordList[currentWordIndex]; };
            const prevBtn = gel("previousWord");
            const nextBtn = gel("nextWord");
            if (prevBtn) prevBtn.addEventListener("click", () => {
                currentWordIndex = (currentWordIndex - 1 + wordList.length) % wordList.length;
                updateWord();
            });
            if (nextBtn) nextBtn.addEventListener("click", () => {
                currentWordIndex = (currentWordIndex + 1) % wordList.length;
                updateWord();
            });
            updateWord();
        }
    })();

    // cancerHotkey.js
    document.addEventListener('keydown', function(event) {
        const action = {
            'KeyA': 'eyedropperBtn',
            'KeyZ': 'undo',
            'KeyX': 'redo',
            'KeyB': 'backgroundPicker',
            'KeyE': 'eraserBtn',
            'KeyS': 'saveImageBtn',
            'KeyR': 'clear',
            'KeyQ': 'symmetryBtn',
            'KeyV': 'smoothDrawingBtn',
            'KeyD': window.createOverlayLayer,
            'KeyG': window.toggleOverlayOpacity,
        }[event.code];

        if (action) {
            event.preventDefault();
            typeof action === 'string' ? gel(action)?.click() : action();
        }
    });
    </script>
